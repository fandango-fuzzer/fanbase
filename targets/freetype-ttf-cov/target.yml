title: FreeType's TrueType driver and sfnt module, built to be measured
formats: [ttf]
run: ["/opt/cov/bin/freetype-harness", "{file}"]   # every face opened, every glyph loaded, hinted and rendered
needs:
  commands: [freetype-harness]      # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "freetype-ttf"]
classify:
  - match: "(?i)out of memory|too large|raster overflow"   # an outline too complex for the rasterizer's own memory
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "freetype-ttf"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "freetype-ttf"]
  seeds: ["/opt/cov/seeds/ttf/*"]
