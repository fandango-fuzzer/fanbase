title: FreeType
formats: [otf, ttf, woff, woff2, pcf]
run: ["{python}", "{dir}/harness.py", "{file}"]   # every face opened, every glyph loaded and rendered
needs:
  python: [ctypes]
version: ["{python}", "{dir}/harness.py", "--version"]
classify:
  - match: "(?i)out of memory|too large|raster overflow"   # an outline too complex for the rasterizer's own memory
    as: resource-limit
  - match: "(?i)unimplemented feature|unknown file format"
    as: unsupported
