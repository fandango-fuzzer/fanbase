title: Xerces-C++ (SAX2Count)
formats: [xml]
run: ["{python}", "{dir}/harness.py", "{file}"]   # SAX2Count -v=never FILE: is it well-formed? Its exit status
needs:
  commands: [SAX2Count]
version: ["{python}", "{dir}/harness.py", "--version"]
classify:
  - match: "(?i)out of memory|limit"
    as: resource-limit
  - match: "(?i)not supported|unsupported"
    as: unsupported
