title: qoi.h, the reference QOI decoder, built to be measured
formats: [qoi]
run: ["/opt/cov/bin/qoi-harness", "{file}"]
needs:
  commands: [qoi-harness]            # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "qoi"]
classify:
  - match: "(?i)too large for this reader|too big|exceeds|memory limit"
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "qoi"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "qoi"]
  seeds: ["/opt/cov/seeds/qoi/*"]
