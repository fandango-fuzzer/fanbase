title: FFmpeg's XPM decoder, built to be measured
formats: [xpm]
run: ["/opt/cov/bin/ffmpeg-harness", "{file}"]
needs:
  commands: [ffmpeg-harness]            # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "ffmpeg-xpm"]
classify:
  - match: "(?i)too large for this reader|too big|exceeds|memory limit"
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "ffmpeg-xpm"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "ffmpeg-xpm"]
  seeds: ["/opt/cov/seeds/xpm/*"]
