title: libarchive's Cabinet reader, built to be measured
formats: [cab]
run: ["/opt/cov/bin/archive-harness", "cab", "{file}"]   # only its Cabinet reader enabled
needs:
  commands: [archive-harness]      # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "libarchive-cab"]
classify:
  - match: "(?i)unsupported|not supported"
    as: unsupported
  - match: "(?i)can't allocate|out of memory"
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "libarchive-cab"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "libarchive-cab"]
  seeds: ["/opt/cov/seeds/cab/*"]
