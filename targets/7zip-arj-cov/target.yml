title: 7-Zip's ARJ reader, built to be measured
formats: [arj]
run: ["/opt/cov/bin/7zz-cov", "t", "-tarj", "-pfanbase", "{file}"]   # 7zz itself: the file opened as ARJ and nothing else, every file in it decoded
needs:
  commands: [7zz-cov]      # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "7zip-arj"]
classify:
  - match: "(?i)unsupported"
    as: unsupported
  - match: "(?i)can ?not allocate memory|not enough memory"
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "7zip-arj"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "7zip-arj"]
  seeds: ["/opt/cov/seeds/arj/*"]
