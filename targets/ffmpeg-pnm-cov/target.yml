title: FFmpeg's PNM decoders (PPM), built to be measured
formats: [ppm]
run: ["/opt/cov/bin/ffmpeg-harness", "{file}"]
needs:
  commands: [ffmpeg-harness]            # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "ffmpeg-pnm"]
classify:
  - match: "(?i)too large for this reader|too big|exceeds|memory limit"
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "ffmpeg-pnm"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "ffmpeg-pnm"]
  seeds: ["/opt/cov/seeds/ppm/*"]
