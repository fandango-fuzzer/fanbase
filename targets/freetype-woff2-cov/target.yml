title: FreeType's WOFF2 reader, with its TrueType and CFF drivers and sfnt module, built to be measured
formats: [woff2]
run: ["/opt/cov/bin/freetype-harness", "{file}"]   # every face opened, every glyph loaded, hinted and rendered
needs:
  commands: [freetype-harness]      # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "freetype-woff2"]
classify:
  - match: "(?i)out of memory|too large|raster overflow"   # an outline too complex for the rasterizer's own memory
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "freetype-woff2"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "freetype-woff2"]
  seeds: ["/opt/cov/seeds/woff2/*"]
