title: libarchive's ar reader, built to be measured
formats: [ar]
run: ["/opt/cov/bin/archive-harness", "ar", "{file}"]   # only its ar reader enabled
needs:
  commands: [archive-harness]      # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "libarchive-ar"]
classify:
  - match: "(?i)unsupported|not supported"
    as: unsupported
  - match: "(?i)can't allocate|out of memory"
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "libarchive-ar"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "libarchive-ar"]
  seeds: ["/opt/cov/seeds/ar/*"]
