title: FreeType's PCF driver, built to be measured
formats: [pcf]
run: ["/opt/cov/bin/freetype-harness", "{file}"]   # every face opened at its first size, every glyph loaded
needs:
  commands: [freetype-harness]      # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "freetype-pcf"]
classify:
  - match: "(?i)out of memory|too large|raster overflow"   # an outline too complex for the rasterizer's own memory
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "freetype-pcf"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "freetype-pcf"]
  seeds: ["/opt/cov/seeds/pcf/*"]
