title: 7-Zip's Unix compress reader, built to be measured
formats: [z]
run: ["/opt/cov/bin/7zz-cov", "t", "-tZ", "{file}"]   # 7zz itself: the file opened as Unix compress and nothing else, and decompressed
needs:
  commands: [7zz-cov]      # from the image of coverage/: this target runs there, and nowhere else
version: ["/opt/cov/bin/versions", "7zip-z"]
classify:
  - match: "(?i)unsupported"
    as: unsupported
  - match: "(?i)out of memory|can ?not allocate memory|not enough memory"
    as: resource-limit
coverage:
  reset: ["/opt/cov/bin/cov-reset", "7zip-z"]
  snapshot: ["/opt/cov/bin/cov-snapshot", "7zip-z"]
  seeds: ["/opt/cov/seeds/z/*"]
