- The Fandango Fuzzer Team
license: Apache-2.0
decodes: always
version: '1.0'
title: X BitMap
extensions:
- xbm
mime: image/x-xbitmap
reference: https://www.x.org/releases/current/doc/libX11/libX11/libX11.pdf
