format: heic
kind: heic-boundary
description: Same as heic, with values taken from the edges of what the format allows
  (degenerate/overflow spatial extents, extreme HEVC profile/level bytes, a hidden-item
  flag, ICC-embedded colr, and the irot/imir/pasp/clap transformative properties)
