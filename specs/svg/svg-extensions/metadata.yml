format: svg
kind: svg-extensions
description: Same as svg, plus legacy SVG 1.1 font/glyph elements, draft SVG 2 paint
  servers (meshGradient, hatch, solidColor) and a few non-SVG embedded tags (audio/video/canvas/iframe)
  that real renderers treat as inert unknown elements
fanbase: 0.5.0
fandango: '>=1.3'
requires: []
authors:
- The Fandango Fuzzer Team
license: Apache-2.0
decodes: always
version: '1.0'
title: Scalable Vector Graphics
extensions:
- svg
mime: image/svg+xml
reference: https://www.w3.org/TR/SVG2/
