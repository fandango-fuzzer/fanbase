name: check

# Every change to the registry has to keep two things true:
# - index.yml and the metadata.yml files are in step with the specs, and
# - every spec still loads in Fandango and produces output.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index:
    name: index is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fanbase

      - name: fanbase reindex --check
        run: fanbase reindex --check

  specs:
    name: specs produce output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fandango-fuzzer

      - name: Produce three inputs from every spec
        run: |
          failed=0
          for spec in specs/*/*/*.fan; do
            out="$(mktemp -d)/inputs"
            echo "::group::$spec"
            if timeout 300 fandango fuzz -f "$spec" -n 3 -d "$out" \
                && [ "$(ls "$out" | wc -l)" -ge 1 ] \
                && [ -n "$(find "$out" -type f -size +0c | head -n 1)" ]; then
              echo "ok: $(ls "$out" | wc -l) files"
            else
              echo "::error file=$spec::no inputs could be produced from this spec"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
