name: check

# Every change to the registry has to keep these true:
# - index.yml and the metadata.yml files are in step with the specs, and what specs extend exists;
# - a spec that changed has a new version (pull requests);
# - every spec still loads in Fandango and produces output: the specs that a pull request changes and the
#   specs that build on them, and on main all of them.
#
# This needs fanbase 0.5 or later.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index:
    name: registry is in order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "fanbase>=0.5"

      - name: fanbase check
        run: fanbase check --no-generate

  versions:
    name: changed specs have a new version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "fanbase>=0.5"

      - name: fanbase changes
        env:
          BASE: https://github.com/${{ github.event.pull_request.base.repo.full_name }}/tree/${{ github.base_ref }}
        run: fanbase changes --base "$BASE" --check

  specs:
    name: specs produce output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fandango-fuzzer "fanbase>=0.5"

      # A pull request is asked about what it changes and what builds on that; main, about every spec.
      - name: Produce three inputs from the specs
        env:
          EVENT: ${{ github.event_name }}
          BASE: https://github.com/${{ github.event.pull_request.base.repo.full_name }}/tree/${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            which="--changed --base $BASE"
          else
            which=""
          fi
          fanbase check --count 3 --timeout 300 -j 4 $which
